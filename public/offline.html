<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>EduReach Offline</title>
    <style>
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        max-width: 560px;
        margin: 24px;
        background: #111827;
        border: 1px solid #334155;
        border-radius: 14px;
        padding: 24px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }
      p {
        margin: 0 0 10px;
        line-height: 1.6;
        color: #cbd5e1;
      }
      button {
        margin-top: 8px;
        background: #4f46e5;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
      }
      button:hover {
        background: #4338ca;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are offline</h1>
      <p>EduReach is in offline mode. Pages you visited before may still work from cache.</p>
      <p>AI actions and new server requests will resume when your internet is back.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
