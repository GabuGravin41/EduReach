services:
  # ─── Web Service (Django + Gunicorn) ──────────────────────────────────────
  - type: web
    name: edureach-backend
    env: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: edureach_project.settings
      - key: REDIS_URL
        fromService:
          type: redis
          name: edureach-redis
          property: connectionString
      # All other env vars (SECRET_KEY, DATABASE_URL, etc.) are set manually
      # in the Render dashboard under Environment > Environment Variables.

  # ─── Celery Background Worker ─────────────────────────────────────────────
  - type: worker
    name: edureach-celery-worker
    env: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start_worker.sh
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: edureach_project.settings
      - key: REDIS_URL
        fromService:
          type: redis
          name: edureach-redis
          property: connectionString
      # Copy the same env vars from your web service here (SECRET_KEY, DATABASE_URL, etc.)

# ─── Redis ──────────────────────────────────────────────────────────────────
databases:
  - name: edureach-redis
    type: redis
    plan: starter   # free tier is available but has no persistence; starter = $10/mo with persistence
    maxmemoryPolicy: allkeys-lru
